# ============================================================
# 设备遥测 / 影子 / 告警 本地服务配置（无需任何外部中间件）
# ============================================================
spring.application.name=device-telemetry-twin
server.port=8080

# --- 遥测接入管道 ---
# 事件时间早于“已接受最新事件时间”超过该毫秒数的上报判定为迟到（STALE，不覆盖状态）
telemetry.late-tolerance-millis=5000
# 事件时间领先接收时间超过该毫秒数判定为未来时间戳（REJECTED，防止设备时钟错乱）
telemetry.future-skew-millis=60000

# --- 规则试算用的有界历史留存 ---
# 每台设备最多留存多少条“已接受（含降级、指标已清洗）”遥测；超出后按 FIFO 淘汰最旧数据
trial.history.max-points-per-device=20000
# 所有设备合计最多留存多少条；超出后在各设备最旧点中淘汰事件时间最早者（全局内存上限）
trial.history.max-total-points=200000

# --- 进程内设备模拟器 ---
# 默认关闭周期上报；改为 true 后启动 2 秒开始、每 3 秒推送一次温度振荡数据
simulator.enabled=false
simulator.initial-delay-ms=2000
simulator.interval-ms=3000

# 日志级别：测试与运行时可看到接入结论与判定依据
logging.level.com.github.h3yow.devicetelemetrytwinjava=INFO
